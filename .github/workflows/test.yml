name: Run Automated Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore tests/Ashbinders.Tests.csproj

    - name: Run Tests
      run: dotnet test tests/Ashbinders.Tests.csproj --no-restore --verbosity normal --collect:"XPlat Code Coverage"
