name: Build & Compile

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore game/Ashbinders.csproj

    - name: Build Game Project
      run: dotnet build game/Ashbinders.csproj --no-restore --configuration Release /p:TreatWarningsAsErrors=true
