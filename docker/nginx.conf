events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Proper MIME types for Godot 4 WebAssembly & PCK
    types {
        application/wasm                   wasm;
        application/javascript             js;
        application/octet-stream           pck;
        image/svg+xml                      svg;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Cross-Origin Isolation headers required for Godot 4 SharedArrayBuffer & Threads
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Access-Control-Allow-Origin "*" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Gzip compression for fast loading
        gzip on;
        gzip_types text/plain text/css application/javascript application/wasm application/octet-stream;
        gzip_min_length 1000;
    }
}
